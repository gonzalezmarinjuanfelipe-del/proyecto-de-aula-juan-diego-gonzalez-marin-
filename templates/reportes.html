<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportes - Sistema de Inventario Deportivo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="{{ url_for('static', filename='css/styles.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="wrapper">
      <!-- Navbar -->
      <nav class="navbar">
        <div class="navbar-brand">
          <i class="fas fa-university"></i>
          <span>Fundación Escuela Tecnológica de Neiva</span>
        </div>
        <div class="navbar-menu">
          <a href="{{ url_for('dashboard') }}" class="nav-link"
            ><i class="fas fa-tachometer-alt"></i> Dashboard</a
          >
          <a href="{{ url_for('inventario') }}" class="nav-link"
            ><i class="fas fa-boxes"></i> Inventario</a
          >
          <a href="{{ url_for('estudiantes') }}" class="nav-link"
            ><i class="fas fa-users"></i> Estudiantes</a
          >
          <a href="{{ url_for('prestamos') }}" class="nav-link"
            ><i class="fas fa-handshake"></i> Préstamos</a
          >
          <a href="{{ url_for('reportes') }}" class="nav-link active"
            ><i class="fas fa-chart-bar"></i> Reportes</a
          >
          <a href="{{ url_for('logout') }}" class="nav-link logout"
            ><i class="fas fa-sign-out-alt"></i> Salir</a
          >
        </div>
        <div class="hamburger" onclick="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>

      <!-- Main Content -->
      <div class="main-content">
        <div class="container-fluid">
          <h1 class="page-title"><i class="fas fa-chart-bar"></i> Reportes</h1>

          <div class="row">
            <div class="col-md-6">
              <div class="report-card">
                <h4><i class="fas fa-file-pdf"></i> Reporte PDF</h4>
                <p>Generar reporte completo del inventario en formato PDF</p>
                <a
                  href="{{ url_for('generar_reporte_pdf') }}"
                  class="btn-report"
                >
                  <i class="fas fa-download"></i> Descargar PDF
                </a>
              </div>
            </div>
            <div class="col-md-6">
              <div class="report-card">
                <h4><i class="fas fa-file-excel"></i> Reporte Excel</h4>
                <p>Generar reporte completo del inventario en formato Excel</p>
                <button
                  class="btn-report"
                  onclick="alert('Funcionalidad próximamente')"
                >
                  <i class="fas fa-download"></i> Descargar Excel
                </button>
              </div>
            </div>
          </div>

          <div class="footer-author">
            <p>Autor: Juan Diego Gonzalez Marin</p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
